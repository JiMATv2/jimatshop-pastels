// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Force all Android modules (including Capacitor's) to use Java 17 for compilation.
// This avoids "invalid source release: 21" when your installed compiler is JDK 17.
subprojects { p ->
    afterEvaluate {
        if (p.plugins.hasPlugin('com.android.application') || p.plugins.hasPlugin('com.android.library')) {
            p.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

// Fix duplicate Kotlin stdlib classes caused by old transitive deps pulling
// kotlin-stdlib-jdk7/jdk8 1.6.x alongside kotlin-stdlib 1.8.x.
// Force all kotlin-stdlib artifacts to the same version so only one set of classes ends up on the classpath.
allprojects { proj ->
    configurations.configureEach { cfg ->
        cfg.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin" &&
                    (details.requested.name == "kotlin-stdlib" ||
                     details.requested.name == "kotlin-stdlib-common" ||
                     details.requested.name == "kotlin-stdlib-jdk7" ||
                     details.requested.name == "kotlin-stdlib-jdk8")) {
                details.useVersion("1.8.22")
                details.because("Avoid duplicate Kotlin stdlib classes (mix of 1.6.x jdk7/jdk8 with 1.8.x stdlib)")
            }
        }
    }
}
